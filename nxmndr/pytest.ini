[pytest]
# Ensure project root is added to sys.path
pythonpath = .

# Test discovery
addopts = -ra

# Enable live logging so test debug/info logs are emitted
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s %(levelname)s %(processName)s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Default test paths (optional; uncomment if you want to restrict)
# testpaths = tst

# Ignore common virtual env and build directories
norecursedirs = .git venv build dist __pycache__

# Show short test summary info
markers =
    integration: marks tests as integration (slow / uses external resources)
    unit: marks tests as fast unit tests
filterwarnings =
    ignore::DeprecationWarning
    ignore:You are using a Backend <class 'torch.distributed.distributed_c10d.ProcessGroupGloo'> as a ProcessGroup.*:UserWarning
